<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRadar — Новости</title>

<style>
:root{
  --bg:#07110d;
  --bg-deep:#0b1711;
  --glass:rgba(255,255,255,0.08);
  --glass-strong:rgba(255,255,255,0.12);
  --stroke:rgba(255,255,255,0.12);
  --text:#f5fbf6;
  --muted:rgba(245,251,246,0.72);
  --accent:#baf28c;
  --accent-dark:#162117;
  --shadow:0 20px 60px rgba(0,0,0,0.28);
  --radius:24px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(6,12,10,0.35),rgba(6,12,10,0.82)),
    url("images/fonn.jpg") center/cover no-repeat;
  z-index:-2;
  transform:scale(1.02);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top right, rgba(186,242,140,0.12), transparent 28%),
    linear-gradient(180deg, rgba(7,17,13,0.14), rgba(7,17,13,0.78));
  z-index:-1;
}

a{
  text-decoration:none;
}

.container{
  width:min(1200px,92%);
  margin:0 auto;
}

.glass{
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
}

/* header */
.header{
  position:sticky;
  top:10px;
  width:min(1200px,95%);
  margin:10px auto 18px;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  z-index:1000;
  background:rgba(15,20,17,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:40px;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

.logo{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.logo h2{
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.03em;
}

.logo span{
  color:var(--muted);
  font-size:14px;
}

.nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.nav a{
  color:#fff;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  transition:transform .25s ease, background .25s ease, border-color .25s ease;
}

.nav a:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,0.12);
  border-color:rgba(255,255,255,0.14);
}

.page-head{
  margin-bottom:18px;
}

.page-head-box{
  padding:28px;
  border-radius:28px;
}

.page-label{
  display:inline-block;
  margin-bottom:12px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  color:var(--muted);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.page-head h1{
  font-size:clamp(32px,5vw,58px);
  line-height:1.02;
  letter-spacing:-0.04em;
  margin-bottom:12px;
}

.page-head p{
  max-width:820px;
  color:rgba(245,251,246,0.84);
  line-height:1.65;
  font-size:18px;
}

/* search */
.search{
  margin:0 0 20px;
}

.search input{
  width:100%;
  padding:16px 18px;
  border:none;
  outline:none;
  border-radius:18px;
  background:rgba(255,255,255,0.1);
  color:#fff;
  font-size:16px;
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.search input::placeholder{
  color:rgba(245,251,246,0.55);
}

/* top layout */
.top-news{
  display:grid;
  grid-template-columns:1.45fr .85fr;
  gap:18px;
  margin-bottom:20px;
}

.main-news{
  padding:28px;
  border-radius:28px;
  min-height:460px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  position:relative;
  overflow:hidden;
}

.main-news::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.75)),
    var(--main-image) center/cover no-repeat;
  z-index:-1;
  transform:scale(1.04);
}

.news-tag{
  display:inline-flex;
  align-items:center;
  width:max-content;
  margin-bottom:14px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(186,242,140,0.16);
  color:var(--accent);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  border:1px solid rgba(186,242,140,0.2);
}

.main-news h2{
  font-size:clamp(30px,4vw,48px);
  line-height:1.02;
  letter-spacing:-0.04em;
  max-width:760px;
  margin-bottom:14px;
}

.main-news p{
  max-width:760px;
  color:rgba(245,251,246,0.86);
  line-height:1.7;
  font-size:17px;
  margin-bottom:18px;
}

.meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
  color:rgba(245,251,246,0.72);
  font-size:14px;
}

.read-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  padding:13px 18px;
  border-radius:16px;
  background:var(--accent);
  color:var(--accent-dark);
  font-weight:700;
  transition:transform .25s ease, box-shadow .25s ease;
}

.read-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(186,242,140,0.18);
}

.side-news{
  display:grid;
  gap:14px;
}

.side-card{
  padding:18px;
  border-radius:22px;
  transition:transform .25s ease, background .25s ease, border-color .25s ease;
}

.side-card:hover{
  transform:translateY(-3px);
  background:var(--glass-strong);
  border-color:rgba(255,255,255,0.16);
}

.side-card .news-image{
  width:100%;
  height:170px;
  border-radius:16px;
  margin-bottom:14px;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.side-card .news-tag{
  margin-bottom:10px;
  font-size:11px;
  padding:7px 10px;
}

.side-card h3{
  font-size:21px;
  line-height:1.2;
  letter-spacing:-0.02em;
  margin-bottom:10px;
}

.side-card p{
  color:rgba(245,251,246,0.82);
  line-height:1.6;
  font-size:15px;
  margin-bottom:12px;
}

.side-card a{
  color:var(--accent);
  font-weight:600;
}

.news-list{
  display:grid;
  gap:14px;
  margin-bottom:26px;
}

.news-item{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:18px;
  padding:18px;
  border-radius:24px;
  transition:transform .25s ease, background .25s ease, border-color .25s ease;
}

.news-item:hover{
  transform:translateY(-3px);
  background:var(--glass-strong);
  border-color:rgba(255,255,255,0.16);
}

.news-thumb{
  min-height:150px;
  border-radius:18px;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.news-content{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.news-content h3{
  font-size:26px;
  line-height:1.15;
  letter-spacing:-0.03em;
  margin-bottom:10px;
}

.news-content p{
  color:rgba(245,251,246,0.82);
  line-height:1.65;
  font-size:16px;
  margin-bottom:12px;
}

.news-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.news-source{
  color:var(--muted);
  font-size:14px;
}

.news-link{
  color:var(--accent);
  font-weight:700;
}

.empty{
  padding:28px;
  border-radius:22px;
  color:var(--muted);
  text-align:center;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
}

@media (max-width:980px){
  .top-news{
    grid-template-columns:1fr;
  }

  .main-news{
    min-height:380px;
  }

  .news-item{
    grid-template-columns:1fr;
  }

  .news-thumb{
    min-height:200px;
  }
}

@media (max-width:640px){
  .header{
    flex-direction:column;
    align-items:flex-start;
    border-radius:28px;
  }

  .nav{
    width:100%;
  }

  .nav a{
    flex:1 1 auto;
    text-align:center;
  }

  .page-head-box,
  .main-news,
  .side-card,
  .news-item{
    padding:18px;
  }

  .main-news h2{
    font-size:32px;
  }

  .side-card h3,
  .news-content h3{
    font-size:22px;
  }

  .side-card .news-image{
    height:150px;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <h2>🌿 EcoRadar</h2>
    <span>Экологические новости и воздух города</span>
  </div>

  <nav class="nav">
    <a href="index.html">Главная</a>
    <a href="map.html">Карта</a>
  </nav>
</header>

<main class="container">

  <section class="page-head">
    <div class="glass page-head-box">
      <div class="page-label">Новости</div>
      <h1>Актуальные экологические новости в удобном формате</h1>
      <p>
        Следите за новостями о качестве воздуха, климате, технологиях во всем мире.
      </p>
    </div>
  </section>

  <div class="search">
    <input type="text" id="search" placeholder="Поиск новостей...">
  </div>

  <section class="top-news">
    <article class="glass main-news" id="mainNews"></article>
    <div class="side-news" id="sideNews"></div>
  </section>

  <section class="news-list" id="newsList"></section>

</main>

<script>
const newsData = [
  {
    title: "Как Германия справляется с экологическими проблемами?",
    description: "Германия представила климатический план, который должен помочь сократить выбросы, расширить ветроэнергетику и снизить зависимость от ископаемого топлива.",
    source: "Reuters",
    time: "25 March 2026",
    category: "Главное",
    image: "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.reuters.com/sustainability/cop/germany-unveils-climate-plan-cut-emissions-fossil-fuels-2026-03-25/"
  },
  {
    title: "ВОЗ про загрязнение воздуха.",
    description: "ВОЗ объясняет, как загрязнение наружного воздуха влияет на здоровье, и напоминает о рисках для дыхательной и сердечно-сосудистой системы.",
    source: "WHO",
    time: "24 October 2024",
    category: "Здоровье",
    image: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.who.int/news-room/fact-sheets/detail/ambient-(outdoor)-air-quality-and-health"
  },
  {
    title: "Амбиции ЕС — план, устраняющий проблемы с загрязнением воздуха.",
    description: "Страны ЕС окончательно одобрили климатическую цель на 2040 год — сократить выбросы парниковых газов на 90 процентов.",
    source: "Reuters",
    time: "5 March 2026",
    category: "Климат",
    image: "https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.reuters.com/sustainability/cop/eu-countries-give-final-approval-2040-climate-target-90-emissions-cut-2026-03-05/"
  },
  {
    title: "Крупный план Казахстана по возвращению редкого вида птиц.",
    description: "В Казахстане начали программу по восстановлению популяции редких соколов-балобанов, выпуская птиц обратно в природную среду.",
    source: "Reuters",
    time: "3 April 2026",
    category: "Казахстан",
    image: "https://images.unsplash.com/photo-1552728089-57bdde30beb3?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.reuters.com/business/environment/kazakhstan-releases-endangered-saker-falcons-saudi-backed-restoration-drive-2026-04-03/"
  },
  {
    title: "Политика углеродного рынка в странах ЕС.",
    description: "Несколько стран ЕС выступили против ослабления углеродного рынка, считая его важным инструментом климатической политики.",
    source: "Reuters",
    time: "12 March 2026",
    category: "Экология",
    image: "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.reuters.com/sustainability/boards-policy-regulation/eight-countries-warn-eu-not-weaken-carbon-market-document-shows-2026-03-12/"
  },
  {
    title: "Достижение Великобритании в вопросе углеродного следа.",
    description: "Выбросы парниковых газов в Великобритании сократились на 2 процента за прошлый год, согласно предварительным правительственным данным.",
    source: "Reuters",
    time: "2 April 2026",
    category: "Выбросы",
    image: "https://images.unsplash.com/photo-1513828583688-c52646db42da?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.reuters.com/sustainability/cop/britains-greenhouse-gas-emissions-fell-2-2025-2026-04-02/"
  },
  {
    title: "Веганство — путь решения к проблемам окружающей среды?",
    description: "Исследование показало, что растительный рацион значительно снижает вред для окружающей среды по сравнению с мясной диетой.",
    source: "The Guardian",
    time: "20 July 2023",
    category: "Образ жизни",
    image: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1600&auto=format&fit=crop",
    link: "https://www.theguardian.com/environment/2023/jul/20/vegan-diet-cuts-environmental-damage-climate-heating-emissions-study"
  }
];

const searchInput = document.getElementById("search");
const mainNews = document.getElementById("mainNews");
const sideNews = document.getElementById("sideNews");
const newsList = document.getElementById("newsList");

function render(list){
  if(!list.length){
    mainNews.innerHTML = `<div class="empty">По вашему запросу новости не найдены.</div>`;
    mainNews.style.removeProperty('--main-image');
    sideNews.innerHTML = "";
    newsList.innerHTML = "";
    return;
  }

  const main = list[0];
  const side = list.slice(1, 4);
  const rest = list.slice(4);

  mainNews.style.setProperty('--main-image', `url('${main.image}')`);
  mainNews.innerHTML = `
    <div class="news-tag">${main.category}</div>
    <h2>${main.title}</h2>
    <p>${main.description}</p>
    <div class="meta">
      <span>${main.source}</span>
      <span>${main.time}</span>
    </div>
    <a class="read-btn" href="${main.link}" target="_blank" rel="noopener noreferrer">Читать источник</a>
  `;

  sideNews.innerHTML = side.map(item => `
    <article class="glass side-card">
      <div class="news-image" style="background-image:url('${item.image}')"></div>
      <div class="news-tag">${item.category}</div>
      <h3>${item.title}</h3>
      <p>${item.description}</p>
      <div class="meta">
        <span>${item.source}</span>
        <span>${item.time}</span>
      </div>
      <a href="${item.link}" target="_blank" rel="noopener noreferrer">Открыть новость →</a>
    </article>
  `).join("");

  newsList.innerHTML = rest.map(item => `
    <article class="glass news-item">
      <div class="news-thumb" style="background-image:url('${item.image}')"></div>
      <div class="news-content">
        <div class="news-tag">${item.category}</div>
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <div class="news-bottom">
          <div class="news-source">${item.source} · ${item.time}</div>
          <a class="news-link" href="${item.link}" target="_blank" rel="noopener noreferrer">Читать источник →</a>
        </div>
      </div>
    </article>
  `).join("");

  if(rest.length === 0){
    newsList.innerHTML += `<div class="empty">Дополнительных новостей пока нет.</div>`;
  }
}

render(newsData);

searchInput.addEventListener("input", e => {
  const val = e.target.value.toLowerCase().trim();
  const filtered = newsData.filter(item =>
    item.title.toLowerCase().includes(val) ||
    item.description.toLowerCase().includes(val) ||
    item.source.toLowerCase().includes(val) ||
    item.category.toLowerCase().includes(val)
  );
  render(filtered);
});
</script>

</body>
</html>
